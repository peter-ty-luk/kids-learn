<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Kart Racing</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
        canvas#gameCanvas { display: block; width: 100%; height: 100%; }

        #hud {
            position: absolute;
            top: 16px;
            left: 16px;
            color: #fff;
            font-size: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
        }
        #hud .lap { font-size: 28px; font-weight: bold; }
        #hud .bar-bg {
            width: 200px; height: 12px;
            background: rgba(255,255,255,0.2);
            border-radius: 6px;
            margin: 4px 0;
        }
        #hud .bar-fill {
            height: 100%; border-radius: 6px;
            transition: width 0.1s;
        }
        #boostBar { background: #ff4444; }
        #oilBar { background: #44cc44; }

        #speed {
            position: absolute;
            bottom: 30px;
            right: 30px;
            color: #fff;
            font-size: 48px;
            font-weight: bold;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.8);
            pointer-events: none;
        }
        #speed span { font-size: 20px; opacity: 0.7; }

        #minimap {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 200px;
            height: 200px;
            border: 2px solid rgba(255,255,255,0.5);
            border-radius: 8px;
            pointer-events: none;
        }

        #instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.6);
            font-size: 14px;
            pointer-events: none;
            text-align: center;
        }

        #countdown {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 96px;
            font-weight: bold;
            text-shadow: 4px 4px 12px rgba(0,0,0,0.8);
            pointer-events: none;
        }

        #item-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) translateY(60px);
            width: 64px; height: 64px;
            background: rgba(0,0,0,0.6);
            border: 3px solid rgba(255,255,255,0.8);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
        }

        #quiz-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        #quiz-box {
            background: linear-gradient(135deg, #1a2a3a, #2a3a4a);
            border: 3px solid #55aaff;
            border-radius: 16px;
            padding: 30px 36px;
            max-width: 520px;
            width: 90%;
            color: #fff;
            text-align: center;
            box-shadow: 0 0 40px rgba(85,170,255,0.3);
        }
        #quiz-box h2 {
            font-size: 22px;
            margin-bottom: 8px;
            color: #55aaff;
        }
        #quiz-box .quiz-subtitle {
            font-size: 14px;
            color: rgba(255,255,255,0.5);
            margin-bottom: 20px;
        }
        #quiz-question {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 24px;
            line-height: 1.4;
        }
        #quiz-choices {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 16px;
        }
        .quiz-choice {
            background: rgba(255,255,255,0.1);
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 10px;
            padding: 12px 20px;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.15s;
            text-align: left;
        }
        .quiz-choice:hover {
            background: rgba(85,170,255,0.3);
            border-color: #55aaff;
        }
        .quiz-choice.correct {
            background: rgba(68,204,68,0.4);
            border-color: #44cc44;
        }
        .quiz-choice.wrong {
            background: rgba(255,68,68,0.4);
            border-color: #ff4444;
        }

        #quiz-typing-area {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }
        #quiz-typing-area.active { display: flex; }

        #quiz-input {
            font-size: 24px;
            padding: 10px 20px;
            border-radius: 10px;
            border: 2px solid rgba(255,255,255,0.4);
            background: rgba(255,255,255,0.1);
            color: #fff;
            text-align: center;
            width: 260px;
            outline: none;
        }
        #quiz-input:focus { border-color: #55aaff; }

        #quiz-submit {
            background: #55aaff;
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 10px 36px;
            font-size: 18px;
            cursor: pointer;
            font-weight: bold;
        }
        #quiz-submit:hover { background: #77ccff; }

        #quiz-feedback {
            font-size: 20px;
            font-weight: bold;
            min-height: 28px;
            margin-bottom: 8px;
        }
        .quiz-correct { color: #44cc44; }
        .quiz-wrong { color: #ff4444; }

        #quiz-timer-bar {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.15);
            border-radius: 3px;
            overflow: hidden;
            margin-top: 12px;
        }
        #quiz-timer-fill {
            height: 100%;
            background: #55aaff;
            border-radius: 3px;
            transition: width 0.1s linear;
            width: 100%;
        }

        .oil-warning {
            color: #ff4444 !important;
            animation: oil-flash 0.5s infinite;
        }
        @keyframes oil-flash {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <div id="hud">
        <div class="lap">Lap <span id="lapNum">1</span> / 3</div>
        <div>Speed Boost</div>
        <div class="bar-bg"><div class="bar-fill" id="boostBar" style="width:100%"></div></div>
        <div style="margin-top:6px;">Oil</div>
        <div class="bar-bg"><div class="bar-fill" id="oilBar" style="width:100%"></div></div>
        <div style="margin-top:8px;">Position: <span id="position">1st</span></div>
    </div>

    <div id="speed"><span id="speedVal">0</span> <span>km/h</span></div>

    <canvas id="minimap" width="200" height="200"></canvas>

    <div id="countdown"></div>
    <div id="item-indicator"></div>

    <div id="instructions">WASD / Arrow Keys to drive &nbsp;|&nbsp; Space to use item &nbsp;|&nbsp; Drive into PIT to refill oil</div>

    <div id="quiz-overlay">
        <div id="quiz-box">
            <h2>PIT STOP</h2>
            <div class="quiz-subtitle">Answer correctly to refill your oil!</div>
            <div id="quiz-question"></div>
            <div id="quiz-choices"></div>
            <div id="quiz-typing-area">
                <input type="text" id="quiz-input" autocomplete="off" />
                <button id="quiz-submit">Submit</button>
            </div>
            <div id="quiz-feedback"></div>
            <div id="quiz-timer-bar"><div id="quiz-timer-fill"></div></div>
        </div>
    </div>

    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="game.js"></script>
</body>
</html>
